
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Craftwood Doors & Windows - Notice</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #eeeeee;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    text-align: center;
    padding: 25px;
}

h1 {
    color: #333;
    font-size: 26px;
    margin-bottom: 12px;
}

.instructions {
    color: #666;
    margin-bottom: 30px;
}

/* Door frame */
.door-frame {
    width: 320px;
    height: 460px;
    margin: auto;
    position: relative;
    background: #ffffff;
    border: 12px solid #333333;
    border-radius: 5px;
    perspective: 1200px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
}

/* Message behind door */
.message {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    background: #fff8e9;
    text-align: center;
}

.message h2 {
    color: #333;
    font-size: 27px;
    margin-bottom: 20px;
}

.message p {
    color: #333;
    font-size: 21px;
    line-height: 1.5;
}

.date {
    color: #a87823;
    font-weight: bold;
}

/* Animated door */
.door {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        110deg,
        #444444,
        #292929 60%,
        #1b1b1b
    );
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1.4s ease-in-out;
    cursor: pointer;
    z-index: 2;
    border: 5px solid #222;
}

/* Decorative door panel */
.door-panel {
    position: absolute;
    top: 22px;
    left: 20px;
    right: 20px;
    bottom: 22px;
    border: 3px solid #555;
    box-shadow: inset 0 0 12px #111;
}

/* Company logo */
.logo {
    position: absolute;
    width: 85%;
    left: 7.5%;
    top: 29%;
    object-fit: contain;
    filter: brightness(0) invert(1);
    z-index: 3;
}

/* Door handle */
.handle {
    position: absolute;
    right: 16px;
    top: 52%;
    width: 15px;
    height: 15px;
    background: #d4af37;
    border-radius: 50%;
    box-shadow: 0 0 6px #111;
    z-index: 4;
}

/* Open door animation */
.door-frame.open .door {
    transform: rotateY(-110deg);
}

/* Button */
button {
    margin-top: 30px;
    background: #333;
    color: white;
    border: none;
    padding: 13px 28px;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s;
}

button:hover {
    background: #a87823;
}

.footer {
    margin-top: 25px;
    font-size: 14px;
    color: #777;
}

@media (max-width: 400px) {
    .door-frame {
        width: 270px;
        height: 400px;
    }

    .message h2 {
        font-size: 23px;
    }

    .message p {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Craftwood Doors & Windows</h1>

    <p class="instructions">
        Click the door to open your message!
    </p>

    <div class="door-frame" id="doorFrame">

        <!-- Message behind the door -->
        <div class="message">
            <h2>Out of Office</h2>

            <p>
                I will not be here on
                <br><br>
                <span class="date">
                    Friday,<br>
                    November 13, 2026
                </span>
            </p>
        </div>

        <!-- Clickable door -->
        <div
            class="door"
            id="door"
            role="button"
            tabindex="0"
            aria-label="Open the door"
            aria-expanded="false"
        >

            <div class="door-panel"></div>

            <img
                src="craftwood-logo.png"
                alt="Craftwood Doors & Windows"
                class="logo"
            >

            <div class="handle"></div>

        </div>

    </div>

    <button id="toggleButton">
        Open Door
    </button>

    <p class="footer">
        Craftwood Doors & Windows
    </p>

</div>

<script>
const doorFrame = document.getElementById("doorFrame");
const door = document.getElementById("door");
const toggleButton = document.getElementById("toggleButton");

function toggleDoor() {
    doorFrame.classList.toggle("open");

    const isOpen = doorFrame.classList.contains("open");

    toggleButton.textContent = isOpen
        ? "Close Door"
        : "Open Door";

    door.setAttribute("aria-expanded", String(isOpen));
}

door.addEventListener("click", toggleDoor);

door.addEventListener("keydown", function(event) {
    if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleDoor();
    }
});

toggleButton.addEventListener("click", toggleDoor);
</script>

</body>
</html>
